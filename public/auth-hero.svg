<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="品牌展示背景">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe8f7"/>
      <stop offset="55%" stop-color="#e9f4fb"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#sky)"/>
  <rect width="1600" height="1200" fill="url(#haze)"/>

  <!-- 雲層（簡化向量，自製，不含外部素材） -->
  <g filter="url(#soft)" opacity="0.9">
    <path d="M160 820c40-70 120-110 210-95 45-85 150-120 240-80 60-70 170-85 250-35 70-55 175-45 235 30 70-20 150 10 185 75 90-8 170 55 170 145 0 95-85 165-190 165H250c-130 0-220-85-220-205 0-60 45-125 130-160z" fill="#ffffff"/>
  </g>

  <g filter="url(#soft)" opacity="0.6">
    <path d="M320 980c25-45 80-70 140-60 30-55 95-75 150-50 40-45 110-55 160-25 45-35 115-30 150 20 45-12 95 8 120 50 55-6 105 30 105 85 0 55-50 100-110 100H420c-80 0-135-50-135-120 0-35 28-78 90-100z" fill="#ffffff"/>
  </g>
</svg>
